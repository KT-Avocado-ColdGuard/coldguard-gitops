# Prometheus Agent: EKS 지표를 모아 KT 허브로 remote_write (저장 안 함, replicas 1)
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-agent, namespace: monitoring}
data:
  agent.yml: |
    global:
      scrape_interval: 15s
      external_labels: {site: central, env: demo, cluster: coldguard-eks}
    scrape_configs:
      - job_name: kube-state-metrics
        static_configs: [{targets: ["kube-state-metrics.monitoring.svc:8080"]}]
      # 컨테이너 CPU·메모리·네트워크 (kubelet cAdvisor를 API 서버 프록시로 읽음)
      - job_name: cadvisor
        scheme: https
        tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
        authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {target_label: __address__, replacement: kubernetes.default.svc:443}
          - {source_labels: [__meta_kubernetes_node_name], target_label: __metrics_path__, replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor}
          - {source_labels: [__meta_kubernetes_node_name], target_label: node}
        metric_relabel_configs:   # 허브 저장량을 줄이려고 필요한 것만 남김
          - source_labels: [__name__]
            regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total|cpu_cfs_throttled_periods_total|oom_events_total)
            action: keep
      # coldguard 앱: Pod에 prometheus.io/scrape: "true" (+ prometheus.io/port, prometheus.io/path) 붙이면 자동 수집
      - job_name: coldguard-central
        honor_labels: true
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [coldguard]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep}
          - {source_labels: [__meta_kubernetes_pod_phase], regex: Running, action: keep}
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], regex: (.+), target_label: __metrics_path__}
          - {source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port], regex: (.+);(\d+), replacement: $1:$2, target_label: __address__}
          - {source_labels: [__meta_kubernetes_pod_label_app], target_label: app}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
    remote_write:
      - url: http://kt-hub.monitoring.svc.cluster.local:9090/api/v1/write
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-agent
  namespace: monitoring
  labels: {app: prometheus-agent}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: prometheus-agent}}
  template:
    metadata:
      labels: {app: prometheus-agent}
    spec:
      serviceAccountName: prometheus-agent
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5
          args:
            - --agent
            - --config.file=/etc/prometheus/agent.yml
            - --storage.agent.path=/data
            - --web.enable-lifecycle
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /data}   # WAL: 허브 단절 동안 쌓였다가 복구 시 재전송 (Pod 재시작하면 사라짐)
      volumes:
        - {name: config, configMap: {name: prometheus-agent}}
        - {name: data, emptyDir: {sizeLimit: 2Gi}}
