# Fluent Bit: coldguard 네임스페이스 컨테이너 로그 → KT 허브 Loki (노드마다 1개, DaemonSet)
apiVersion: v1
kind: ConfigMap
metadata: {name: fluent-bit, namespace: monitoring}
data:
  fluent-bit.yaml: |
    service:
      flush: 5
      log_level: info
      parsers_file: /fluent-bit/etc/parsers.yaml
      storage.path: /buffer
      http_server: on
      http_port: 2020
    pipeline:
      inputs:
        - name: tail
          path: /var/log/containers/*_coldguard_*.log
          multiline.parser: cri
          path_key: filepath
          db: /buffer/tail.db
          storage.type: filesystem
          mem_buf_limit: 16MB
      filters:
        - {name: parser, match: '*', key_name: filepath, parser: k8s_path, reserve_data: on}
        - {name: parser, match: '*', key_name: log, parser: json, reserve_data: on}
        - name: modify
          match: '*'
          copy: [logged_at ts, at ts]
        - {name: parser, match: '*', key_name: ts, parser: [ts_frac, ts_sec], reserve_data: on}
        - name: record_modifier
          match: '*'
          remove_key: [filepath, pod, namespace, stream, logtag, time, _p, ts]
      outputs:
        - name: loki
          match: '*'
          host: kt-hub.monitoring.svc.cluster.local
          port: 3100
          labels: site=central, env=demo, app=$container
          remove_keys: container
          line_format: json
          storage.total_limit_size: 512M
  parsers.yaml: |
    parsers:
      - name: json
        format: json
      - name: ts_frac
        format: regex
        regex: '^(?<time>\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d+Z)$'
        time_key: time
        time_format: '%Y-%m-%dT%H:%M:%S.%LZ'
      - name: ts_sec
        format: regex
        regex: '^(?<time>\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ)$'
        time_key: time
        time_format: '%Y-%m-%dT%H:%M:%SZ'
      # 로그 파일명: <pod>_<namespace>_<container>-<64자 id>.log
      - name: k8s_path
        format: regex
        regex: '(?<pod>[^/_]+)_(?<namespace>[^_]+)_(?<container>.+)-[0-9a-f]{64}\.log$'
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: monitoring
  labels: {app: fluent-bit}
spec:
  selector: {matchLabels: {app: fluent-bit}}
  template:
    metadata: {labels: {app: fluent-bit}}
    spec:
      serviceAccountName: fluent-bit
      tolerations: [{operator: Exists}]   # 모든 노드 로그 수집
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.2.0
          args: [-c, /fluent-bit/etc/fluent-bit.yaml]
          ports: [{name: http, containerPort: 2020}]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {runAsUser: 0, readOnlyRootFilesystem: true}   # 노드 로그(root 소유) 읽기
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: buffer, mountPath: /buffer}   # 노드에 남겨 Pod 재시작해도 미전송분·읽은 위치 유지
      volumes:
        - {name: config, configMap: {name: fluent-bit}}
        - {name: varlog, hostPath: {path: /var/log}}
        - {name: buffer, hostPath: {path: /var/lib/coldguard-fluent-bit, type: DirectoryOrCreate}}
