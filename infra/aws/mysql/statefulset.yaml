# 중앙 MySQL (단일 레플리카)
# EBS 볼륨 때문에 처음 뜬 AZ에 묶인다. 그 AZ 노드가 없으면 노드가 돌아올 때까지 기다린다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: coldguard
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: coldguard
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: coldguard
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - configMapRef:
                name: mysql-params
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: api-password
            - name: MYSQL_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: worker-password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 --silent"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 --silent"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 --silent"]
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            # ext4 볼륨 루트의 lost+found 때문에 초기화가 실패하므로 하위 폴더를 쓴다
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
            - name: config
              mountPath: /etc/mysql/conf.d
              readOnly: true
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mysql-config
        - name: initdb
          configMap:
            name: mysql-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
