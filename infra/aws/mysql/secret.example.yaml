# 형식 예시만 둔다. 이 파일은 적용하지 않고 실제 값은 README의 kubectl 명령으로 만든다.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-auth
  namespace: coldguard
type: Opaque
stringData:
  root-password: <랜덤 32자>
  api-password: <랜덤 32자>      # coldguard_api (통제 API)
  worker-password: <랜덤 32자>   # coldguard_worker (수집 워커)
