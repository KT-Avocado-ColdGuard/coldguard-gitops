# 앱 접속 주소: mysql.coldguard.svc.cluster.local:3306
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: coldguard
  labels:
    app.kubernetes.io/name: mysql
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
# StatefulSet용 headless Service
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: coldguard
  labels:
    app.kubernetes.io/name: mysql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
