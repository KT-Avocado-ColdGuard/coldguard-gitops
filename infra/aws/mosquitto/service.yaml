# 클러스터 내부 주소: mosquitto.coldguard.svc.cluster.local (1883 평문, 8883 TLS)
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: coldguard
  labels:
    app.kubernetes.io/name: mosquitto
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
    - name: mqtts
      port: 8883
      targetPort: mqtts
---
# 시설 브리지용 tailnet 노출 (TLS 8883만)
# 주소: coldguard-mqtt.<tailnet>.ts.net:8883, ACL은 tag:onprem → tag:eks-mqtt tcp:8883
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-tailnet
  namespace: coldguard
  annotations:
    tailscale.com/hostname: coldguard-mqtt
    tailscale.com/tags: "tag:eks-mqtt"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - name: mqtts
      port: 8883
      targetPort: mqtts
