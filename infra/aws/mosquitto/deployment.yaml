# 중앙 MQTT 브로커 (시설 브리지 종단, 통제 명령 중계)
# RWO 볼륨이라 Recreate로 교체한다 (RollingUpdate면 새 Pod가 볼륨을 못 붙여 멈춘다)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: coldguard
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: coldguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/part-of: coldguard
    spec:
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        runAsNonRoot: true
      # Secret·ConfigMap 볼륨 파일(root 소유 심볼릭 링크)을 Mosquitto 2.1이 열지 못해서
      # ("Unable to open pwfile"), mosquitto(1883) 소유 0600 일반 파일로 메모리 볼륨에 복사한다.
      initContainers:
        - name: prepare-files
          image: eclipse-mosquitto:2.1.2-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /src/auth/passwd /secure/passwd
              cp /src/config/acl /secure/acl
              cp /src/tls/ca.crt /src/tls/tls.crt /src/tls/tls.key /secure/
              chmod 600 /secure/*
              ls -l /secure
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /src/config
              readOnly: true
            - name: auth
              mountPath: /src/auth
              readOnly: true
            - name: tls
              mountPath: /src/tls
              readOnly: true
            - name: secure
              mountPath: /secure
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.2-alpine
          command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
            - name: mqtts
              containerPort: 8883
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: secure
              mountPath: /mosquitto/secure
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: auth
          secret:
            secretName: mosquitto-auth
            defaultMode: 0440
        - name: tls
          secret:
            secretName: mosquitto-tls
            defaultMode: 0440
        - name: secure
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
