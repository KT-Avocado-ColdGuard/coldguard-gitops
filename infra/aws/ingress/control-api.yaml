# 통제 API tailnet 노출 (HTTPS, Tailscale이 인증서 발급)
# 주소: https://control-api.<tailnet>.ts.net, ACL은 tag:kt-hub·group:kt-admins → tag:eks-api tcp:443
# 뒤의 Service(control-api, 80)는 apps/control-api에서 개발 쪽이 만든다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-api-tailnet
  namespace: coldguard
  annotations:
    tailscale.com/tags: "tag:eks-api"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: control-api
      port:
        number: 80
  tls:
    - hosts:
        - control-api
