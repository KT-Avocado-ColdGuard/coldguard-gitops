# 중앙 Mosquitto 감시. 브로커의 $SYS 상태 토픽을 구독해 지표로 바꾼다.
# monitoring의 Prometheus agent(coldguard-central 작업)가 자동 수집한다.
# 계정 monitor: ACL에서 $SYS/# 읽기만 허용. 비밀번호는 mosquitto-monitor Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto-exporter
  namespace: coldguard
  labels:
    app.kubernetes.io/name: mosquitto-exporter
    app.kubernetes.io/part-of: coldguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto-exporter
        app.kubernetes.io/part-of: coldguard
        app: mosquitto-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9234"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: sapcc/mosquitto-exporter:0.8.0
          # 비밀번호는 쿠버네티스가 실행 직전에 $(MQTT_PASS)를 Secret 값으로 바꿔 넣는다.
          args:
            - --endpoint=tcp://mosquitto:1883
            - --bind-address=0.0.0.0:9234
            - --user=monitor
            - --pass=$(MQTT_PASS)
          env:
            - name: MQTT_PASS
              valueFrom:
                secretKeyRef:
                  name: mosquitto-monitor
                  key: password
          ports:
            - name: metrics
              containerPort: 9234
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
