# 중앙 MySQL 감시. monitoring의 Prometheus agent(coldguard-central 작업)가 자동 수집한다.
# 계정 coldguard_exporter: PROCESS, REPLICATION CLIENT, performance_schema 읽기만 (initdb 04).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
  namespace: coldguard
  labels:
    app.kubernetes.io/name: mysqld-exporter
    app.kubernetes.io/part-of: coldguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysqld-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysqld-exporter
        app.kubernetes.io/part-of: coldguard
        app: mysqld-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9104"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: prom/mysqld-exporter:v0.21.0
          args:
            - --mysqld.address=mysql:3306
            - --mysqld.username=coldguard_exporter
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: exporter-password
          ports:
            - name: metrics
              containerPort: 9104
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
