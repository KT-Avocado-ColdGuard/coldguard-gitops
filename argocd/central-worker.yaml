# 중앙 수집 워커 배포.
# 매니페스트는 비공개 저장소 coldguard-deploy의 central-worker/ 에 있다.
# (이미지 주소에 AWS 계정 ID가 들어가므로 공개 저장소인 이 gitops에는 두지 않는다.)
# Argo CD가 비공개 저장소를 읽으려면 argocd 네임스페이스에 저장소 자격 증명 Secret이 있어야 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: central-worker
  namespace: argocd
spec:
  project: coldguard
  source:
    repoURL: https://github.com/KT-Avocado-ColdGuard/coldguard-deploy.git
    targetRevision: main
    path: central-worker
  destination:
    server: https://kubernetes.default.svc
    namespace: coldguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
