# ColdGuard 앱 전용 AppProject
# 이 저장소에서만 가져오고, coldguard·monitoring·argocd 네임스페이스에만 배포한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: coldguard
  namespace: argocd
spec:
  description: ColdGuard AWS EKS 배포
  sourceRepos:
    - https://github.com/KT-Avocado-ColdGuard/coldguard-gitops.git
    - git@github.com:KT-Avocado-ColdGuard/coldguard-deploy.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: coldguard
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: argocd
  # 네임스페이스와 모니터링 에이전트의 클러스터 권한만 허용
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
