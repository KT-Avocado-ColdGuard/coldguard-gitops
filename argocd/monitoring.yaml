# 모니터링 담당: Prometheus Agent, kube-state-metrics, Fluent Bit (infra/aws/monitoring)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: coldguard
  source:
    repoURL: https://github.com/KT-Avocado-ColdGuard/coldguard-gitops.git
    targetRevision: main
    path: infra/aws/monitoring
    directory:
      exclude: "*.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
